# Builds the Android APK on GitHub's servers and attaches it to a GitHub Release.
# Run it by pushing a version tag (git tag v1.0.0 && git push origin v1.0.0),
# or by hand from the Actions tab (that run uploads the APK as a build artifact only).
name: Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Check the question bank and run the tests
        run: |
          npm run build-questions
          git diff --exit-code src/data/questions.json
          npm run typecheck
          npm test -- --ci

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      # Release builds are signed with the Expo template's fixed key, so a newer APK installs over an older one.
      - name: Build the APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Name the APK
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          mkdir -p ../dist
          cp android/app/build/outputs/apk/release/app-release.apk "../dist/Akada-${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: akada-apk
          path: dist/*.apk

      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
